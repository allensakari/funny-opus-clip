[project]
name = "funny-opus-clip"
version = "0.1.0"
description = "Claude Code skill: data / science short clips from one topic (engine, styles, channel profiles)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "skia-python==144.0.post2",
  "moderngl>=5.12",
  "numpy>=2.0",
  "scipy",
  "pillow",
  "sgp4",
  "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",   # narration self-check only
  "mpmath",
  "h5py>=3.16.0",
  "pyshp>=3.1.6",
  "matplotlib>=3.11.2",
  "pypdf>=6.20.0",
  "openpyxl>=3.1.5",
]

[tool.uv]
package = false
